<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REAHDIM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">

<style>
/* ── tokens ─────────────────────────────────────────────────────────────
   ground is cool so the cream scans read as paper, not as dirty white.
   ochre  = the book's only colour (the flower centres on SC3 #4)
   teal   = the instrument's colour. never from the book. never mixed.
──────────────────────────────────────────────────────────────────────── */
:root{
  --ground:#CBCFCF; --ground-2:#C0C5C6; --panel:#EDEDEA; --panel-2:#E1E2DE;
  --ink:#16181A; --ink-2:#4A5052; --muted:#767D7E; --hair:#A9AFAF; --hair-2:#BCC1C1;
  --ochre:#8C6710; --ochre-soft:#C9A44A; --teal:#0F5F68; --teal-soft:#9EC4C8;
  --paper-shadow:rgba(20,24,26,.28); --veil:#B9BEBE;
  --blank:#DEDFDB;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131619; --ground-2:#0D0F12; --panel:#1B1F23; --panel-2:#22262B;
    --ink:#E9E7E1; --ink-2:#B4B8B9; --muted:#828A8D; --hair:#333A3F; --hair-2:#2A3035;
    --ochre:#E0AE3A; --ochre-soft:#7A5E1E; --teal:#5CC6D1; --teal-soft:#1E4A50;
    --paper-shadow:rgba(0,0,0,.6); --veil:#0F1215;
    --blank:#20242A;
  }
}
:root[data-theme="dark"]{
  --ground:#131619; --ground-2:#0D0F12; --panel:#1B1F23; --panel-2:#22262B;
  --ink:#E9E7E1; --ink-2:#B4B8B9; --muted:#828A8D; --hair:#333A3F; --hair-2:#2A3035;
  --ochre:#E0AE3A; --ochre-soft:#7A5E1E; --teal:#5CC6D1; --teal-soft:#1E4A50;
  --paper-shadow:rgba(0,0,0,.6); --veil:#0F1215;
  --blank:#20242A;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.45; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
.mono{font-family:"DM Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ── shell ─────────────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

.count{font-size:10px;color:var(--muted);line-height:1.6;font-weight:500}
.txtbtn{
  display:block;text-align:left;
  font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;
  color:var(--ink-2);border-bottom:1px solid var(--hair);padding-bottom:1px;
}
.txtbtn:hover{color:var(--ink);border-color:var(--ink)}
.backlink{
  position:absolute;right:18px;top:16px;z-index:4;
  display:flex;align-items:center;gap:6px;text-decoration:none;
  font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;
  color:var(--ink-2);border-bottom:1px solid var(--hair);padding-bottom:1px;
}
.backlink:hover{color:var(--ink);border-color:var(--ink)}
.backlink .ico{font-size:13px;line-height:1}

/* ── consequence readout ───────────────────────────────────────────── */
.consequence{
  display:none;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 16px;background:var(--teal-soft);color:var(--ink);
  border-bottom:1px solid var(--hair);font-size:12px;
}
.consequence.on{display:flex}
.consequence .dot{width:7px;height:7px;background:var(--teal);border-radius:50%;flex:none}
.consequence b{font-weight:600}
.consequence .close{margin-left:auto;font-size:16px;line-height:1;color:var(--ink-2);padding:0 4px}

/* ── stage ─────────────────────────────────────────────────────────── */
.stage{
  position:relative;flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  padding:16px;overflow:hidden;
}

/* everything but the book lives in the rail, in the dead space beside it */
.rail{
  position:absolute;left:18px;top:16px;bottom:16px;width:92px;z-index:3;
  display:flex;flex-direction:column;justify-content:space-between;
}
.rail-top b{display:block;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--ink)}
.rail-top span{
  display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-top:2px;
}
.rail-mid{display:flex;flex-direction:column;gap:5px}
.rail-bot{display:flex;flex-direction:column;gap:8px;align-items:flex-start}

/* The mirror rail. Reading controls live on the left; the two that
   change what the book contains live on the right, away from them —
   adding and removing a page is not the same kind of act as looking. */
.rail-right{
  position:absolute;right:18px;bottom:16px;width:104px;z-index:3;
  display:flex;flex-direction:column;gap:8px;align-items:flex-end;text-align:right;
}
.rail-right .txtbtn{text-align:right}
.rail-right .txtbtn:disabled{opacity:.3;cursor:default;border-color:var(--hair)}
.rail-right .txtbtn:disabled:hover{color:var(--ink-2);border-color:var(--hair)}
.selline{
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  color:var(--muted);line-height:1.5;
}
.outline-restore{
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  color:var(--ochre);cursor:pointer;line-height:1.5;
}
.outline-restore:hover{color:var(--ink)}
.srcline{
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;line-height:1.5;
  color:var(--muted);
}
.srcline.synced{color:var(--teal)}

/* sync progress */
.syncing{
  position:fixed;inset:0;z-index:40;background:var(--ground);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.syncing.on{display:flex}
.syncing .big{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.syncing .sub{font-size:12px;color:var(--muted);max-width:44ch;text-align:center;line-height:1.5}
.syncbar{width:260px;height:3px;background:var(--hair);overflow:hidden}
.syncbar i{display:block;height:100%;background:var(--teal);width:0}
.rail .modebtn{
  padding:9px 0;text-align:center;border:1px solid var(--hair);border-radius:2px;
  background:var(--panel);color:var(--ink-2);
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;
}
.rail .modebtn:hover{background:var(--panel-2);color:var(--ink)}
.rail .modebtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.rail .pager{display:flex;gap:5px;margin-top:10px}
.rail .pager button{
  flex:1;height:28px;border:1px solid var(--hair);border-radius:2px;background:var(--panel);
  color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:13px;
}
.rail .pager button:hover:not(:disabled){background:var(--ink);color:var(--panel);border-color:var(--ink)}
.rail .pager button:disabled{opacity:.3;cursor:default}
.rail .status{margin-top:13px}
.rail .verdict{
  display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  border:1px solid currentColor;border-radius:2px;padding:7px 5px;text-align:center;line-height:1.4;
}

/* the book sits dead centre and does not move between spreads */
.sheets{display:flex;align-items:flex-start;justify-content:center;gap:0}

/* ── the wall ──────────────────────────────────────────────────────
   Every spread in the chapter at once, at about half the size of the
   stage. Spreads stay paired here, with their gutter, so the wall is
   the book seen from above rather than a pile of loose pages.
─────────────────────────────────────────────────────────────────── */
.stage.wallmode{align-items:stretch}
.sheets.wall{
  display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;
  gap:22px 26px;width:100%;height:100%;overflow-y:auto;
  padding:2px 116px 14px;
}
.wallgrp{display:flex;align-items:flex-start;position:relative;padding-top:14px}
.wallgrp::before{
  content:attr(data-spread);position:absolute;top:0;left:0;
  font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.1em;color:var(--muted);
}
.wallpage{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.wallpage img,.wallpage .blanktile{display:block;box-shadow:0 2px 10px var(--paper-shadow)}
.wallpage .blanktile{border:1px dashed var(--hair);background:var(--blank)}
.wallpage .cap{
  display:flex;gap:6px;align-items:baseline;font-size:9px;letter-spacing:.08em;color:var(--muted);
  font-family:"DM Mono",monospace;
}
.wallpage.here img,.wallpage.here .blanktile{outline:2px solid var(--ink);outline-offset:2px}
.wallpage.here .cap{color:var(--ink)}
.wallpage:hover .cap{color:var(--ink-2)}
.wallgut{flex:none;width:10px;align-self:stretch;
  background:linear-gradient(90deg,transparent,var(--paper-shadow) 45%,var(--paper-shadow) 55%,transparent);opacity:.65}
.slot{flex:none;display:flex;flex-direction:column;align-items:center}
.slot.empty > *{visibility:hidden}

/* one page */
.page{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.page-img{
  display:block;background:var(--blank);box-shadow:0 2px 14px var(--paper-shadow);
  max-width:100%;height:auto;
}
.page.blank.noimg .page-img{
  border:1px dashed var(--hair);box-shadow:none;
  display:flex;align-items:center;justify-content:center;
}
/* a blank made from Blank_Page.jpg is real paper, so it keeps the shadow
   and is told apart by its label, not by a dashed box */
.page.blank:not(.noimg) .page-img{opacity:.96}
.blank-mark{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}

.page-foot{
  display:flex;align-items:center;gap:9px;justify-content:center;
  height:22px;max-width:100%;overflow:hidden;white-space:nowrap;
}
.pnum{
  font-size:10.5px;font-weight:500;color:var(--ink);
  background:var(--panel);border:1px solid var(--hair);border-radius:2px;padding:1px 6px;
}
.pside{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.plabel{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.pnote{
  font-size:11.5px;color:var(--muted);text-align:center;max-width:34ch;line-height:1.35;
  height:32px;overflow:hidden;
}

/* gutter between verso and recto */
.gutter{
  width:18px;flex:none;
  background:linear-gradient(90deg,transparent,var(--paper-shadow) 42%,var(--paper-shadow) 58%,transparent);
  opacity:.8;
}

/* insert handles on stage pages */
.ins{
  position:absolute;top:0;bottom:0;width:22px;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .12s;
}
.page:hover .ins,.ins:focus-within{opacity:1}
.ins.before{left:-24px}
.ins.after{right:-24px}
.ins button{
  width:20px;height:20px;border:1px solid var(--hair);background:var(--panel);
  border-radius:50%;font-size:13px;line-height:1;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;
}
.ins button:hover{background:var(--ink);color:var(--panel);border-color:var(--ink)}
@media (prefers-reduced-motion:reduce){.ins{transition:none}}

/* weight meter — centre of ink mass, computed from the scan */
.weight{display:flex;align-items:center;gap:7px}
.wbox{position:relative;width:15px;height:21px;border:1px solid var(--hair);background:var(--panel)}
.wbox i{position:absolute;width:5px;height:5px;background:var(--ochre);border-radius:50%;transform:translate(-50%,-50%)}
.wtxt{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

.flag{
  display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  color:var(--ochre);border:1px solid var(--ochre-soft);border-radius:2px;
  padding:7px 5px;text-align:center;line-height:1.4;margin-top:8px;
}

/* ── ribbon ────────────────────────────────────────────────────────── */
.ribbon-wrap{background:var(--panel);border-top:1px solid var(--hair);flex:none}
.ribbon{display:flex;align-items:flex-end;gap:0;padding:9px 16px 10px;overflow-x:auto;overflow-y:hidden}
.spreadgrp{display:flex;flex:none;margin-right:16px;position:relative;padding-top:13px}
.spreadgrp::before{
  content:attr(data-spread);position:absolute;top:0;left:0;
  font-family:"DM Mono",monospace;font-size:9px;letter-spacing:.1em;color:var(--muted);
}
.spreadgrp.solo{opacity:.9}

.chip{
  position:relative;flex:none;width:38px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:3px;border:1px solid transparent;background:none;
}
.chip:hover{border-color:var(--hair)}
.chip[aria-current="true"]{border-color:var(--ink);background:var(--panel-2)}
.chip img{width:100%;height:40px;object-fit:cover;object-position:top center;display:block;box-shadow:0 1px 4px var(--paper-shadow)}
.chip .blankbox{width:100%;height:40px;border:1px dashed var(--hair);background:var(--blank)}
.chip .cn{font-family:"DM Mono",monospace;font-size:9.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip .cs{font-size:8px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.chip.flipped{background:var(--teal-soft)}
.chip.flipped .cs{color:var(--teal)}
.chip.verso{align-items:flex-end}
.chip.recto{align-items:flex-start}

.chipdel{
  position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;
  background:var(--ink);color:var(--panel);font-size:11px;line-height:1;
  display:none;align-items:center;justify-content:center;
}
.chip.isblank:hover .chipdel{display:flex}


/* ── the exported book, read in place ─────────────────────────────
   An export you have to leave the page to look at is not finished, so
   the PDF opens here in the browser's own viewer.
─────────────────────────────────────────────────────────────────── */
.pdfwrap{position:fixed;inset:0;z-index:50;background:var(--ground);display:none;flex-direction:column}
.pdfwrap.on{display:flex}
.pdfbar{
  flex:none;display:flex;align-items:center;gap:14px;padding:9px 16px;
  background:var(--panel);border-bottom:1px solid var(--hair);
}
.pdftitle{font-size:11px;letter-spacing:.08em;color:var(--ink-2)}
.pdfnote{font-size:10px;color:var(--muted);margin-right:auto;letter-spacing:.04em}
.pdfbar button{
  font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  color:var(--ink-2);border-bottom:1px solid var(--hair);padding-bottom:1px;
  background:none;border-top:0;border-left:0;border-right:0;cursor:pointer;
}
.pdfbar button:hover{color:var(--ink);border-color:var(--ink)}
#pdf-frame{flex:1;width:100%;border:0;background:var(--ground-2)}

/* ── arrangement panel ─────────────────────────────────────────────── */
.sheetpanel{
  position:fixed;inset:auto 0 0 0;max-height:70vh;overflow:auto;z-index:20;
  background:var(--panel);border-top:1px solid var(--hair);padding:16px 18px 22px;
  box-shadow:0 -10px 34px var(--paper-shadow);display:none;
}
.sheetpanel.on{display:block}
.sheetpanel h2{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.sheetpanel p{margin:0 0 12px;font-size:12px;color:var(--muted);max-width:64ch}
.sheetpanel pre{
  margin:0;padding:12px;background:var(--ground);border:1px solid var(--hair);
  font-family:"DM Mono",monospace;font-size:11.5px;line-height:1.6;
  white-space:pre;overflow-x:auto;color:var(--ink-2);user-select:all;
}
.sheetpanel .close{position:absolute;top:12px;right:16px;font-size:18px;color:var(--ink-2)}

@media (max-width:760px){
  .sheets{flex-direction:column;align-items:center;gap:14px}
  .gutter{display:none}
  .pnote{max-width:40ch}
}

/* ── chapters ──────────────────────────────────────────────────────
   Four arcs, one panel. The rail switches between them; each keeps its
   own pagination, because a blank inserted in PHĒ has nothing to do
   with NO.
─────────────────────────────────────────────────────────────────── */
.chapters{display:flex;flex-direction:column;gap:3px;margin-top:9px}
.chapbtn{
  display:flex;align-items:baseline;gap:6px;padding:4px 6px;border-radius:2px;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;
  color:var(--muted);border:1px solid transparent;text-align:left;
}
.chapbtn:hover{color:var(--ink);background:var(--panel)}
.chapbtn[aria-pressed="true"]{color:var(--ink);background:var(--panel);border-color:var(--hair)}
.chapbtn .n{
  margin-left:auto;font-family:"DM Mono",monospace;font-size:9px;font-weight:500;
  color:var(--muted);letter-spacing:0;
}
.chapbtn.empty{opacity:.45}
.chapbtn.empty:hover{opacity:.75}

/* pages whose filename carries no position — kept, never dropped */
.loose{
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  color:var(--ochre);line-height:1.5;cursor:help;
}

/* ── reordering ────────────────────────────────────────────────────
   Drag a chip. The insertion point is a hairline between chips, not a
   highlight on them, so you are aiming at a gap rather than at a page.
─────────────────────────────────────────────────────────────────── */
.chip[draggable="true"]{cursor:grab}
.chip.dragging{opacity:.3}
.chip.dropL{box-shadow:inset 2px 0 0 0 var(--teal)}
.chip.dropR{box-shadow:inset -2px 0 0 0 var(--teal)}

/* ── empty state ───────────────────────────────────────────────────
   Nothing is baked into this file any more, so the first run has an
   honest nothing to show.
─────────────────────────────────────────────────────────────────── */
.nothing{
  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  color:var(--muted);max-width:42ch;
}
.nothing b{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.nothing p{margin:0;font-size:12.5px;line-height:1.55}
.nothing code{font-family:"DM Mono",monospace;font-size:11.5px;color:var(--ink-2)}
.nothing .go{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink);
  border:1px solid var(--ink);border-radius:2px;padding:7px 16px;margin-top:4px;
}
.nothing .go:hover{background:var(--ink);color:var(--panel)}
</style>
</head>
<body>

<div class="app">

  <div class="consequence" id="consequence">
    <span class="dot"></span>
    <span id="consequence-text"></span>
    <button class="close" id="consequence-close" aria-label="Dismiss">&times;</button>
  </div>

  <main class="stage">
    <a class="backlink" href="index.html#studio" title="Back to AH! Studio"><span class="ico">&larr;</span><span>back</span></a>
    <nav class="rail" aria-label="Controls">
      <div class="rail-top">
        <b>REAHDIM</b>
        <span id="chap-full">PHENOMENAH!</span>
        <div class="chapters" id="chapters"></div>
      </div>
      <div class="rail-mid">
        <button class="modebtn" id="m-single" aria-pressed="false">Single</button>
        <button class="modebtn" id="m-spread" aria-pressed="true">Spread</button>
        <button class="modebtn" id="m-wall" aria-pressed="false">Wall</button>
        <div class="pager">
          <button id="prev" aria-label="Previous">&larr;</button>
          <button id="next" aria-label="Next">&rarr;</button>
        </div>
        <div class="status" id="status"></div>
      </div>
      <div class="rail-bot">
        <span class="count mono" id="count"></span>
        <span class="loose" id="loose"></span>
        <span class="srcline" id="srcline"></span>
        <button class="txtbtn" id="btn-sync">Sync folder</button>
        <button class="txtbtn" id="btn-sheet">Arrangement</button>
        <button class="txtbtn" id="btn-export">Export PDF</button>
        <input type="file" id="folder" webkitdirectory directory multiple hidden>
      </div>
    </nav>
    <nav class="rail-right" aria-label="Edit the book">
      <span class="selline" id="selline"></span>
      <span class="outline-restore" id="restore" hidden></span>
      <button class="txtbtn" id="btn-blank">Add blank</button>
      <button class="txtbtn" id="btn-remove">Remove page</button>
    </nav>
    <div class="sheets" id="sheets"></div>
  </main>

  <div class="ribbon-wrap">
    <div class="ribbon" id="ribbon"></div>
  </div>

</div>

<div class="syncing" id="syncing">
  <span class="big" id="sync-title">Reading the folder</span>
  <div class="syncbar"><i id="sync-bar"></i></div>
  <span class="sub" id="sync-sub"></span>
</div>

<div class="pdfwrap" id="pdfwrap">
  <div class="pdfbar">
    <span class="pdftitle mono" id="pdf-title"></span>
    <span class="pdfnote" id="pdf-note"></span>
    <button id="pdf-save">Download</button>
    <button id="pdf-close" aria-label="Close">Close &times;</button>
  </div>
  <iframe id="pdf-frame" title="The exported book"></iframe>
</div>

<div class="sheetpanel" id="sheetpanel">
  <button class="close" id="sheet-close" aria-label="Close">&times;</button>
  <h2>Arrangement</h2>
  <p>The current pagination. Select and copy this if you want to hand it back to me.</p>
  <pre id="sheet-text"></pre>
</div>

<script>
/* ===================================================================
   REAHDIM — an imposition table for the book.

   Not a library and not a reader: this asks what the pages do to each
   other once they are bound. Recto and verso, which spreads pair up,
   what a page turn hides, and where the ink sits on the paper.

   It is a local tool. Nothing is baked into this file and nothing is
   uploaded anywhere — every page comes off your own disk, one
   deliberate Sync at a time.

   THE FOLDER
     PHENO.MENAH!/
       PHE/   CH.Phe.jpg  SC1.#1.jpg  SC1.#2.jpg  …
       NO/    …
       MEN/   …
       AH/    …
       Blank_Page.jpg          ← the paper a blank is made of

   A subfolder named for a chapter is that chapter. Loose files at the
   top level fall into PHĒ. Nothing is ever discarded: a filename this
   file cannot read a position from still lands in the book, at the end
   of its chapter, and says so in the rail.
   =================================================================== */

const CHAPTERS = [
  { id:"PHE", label:"PHĒ", full:"PHENOMENAH!" },
  { id:"NO",  label:"NO",  full:"NO"          },
  { id:"MEN", label:"MEN", full:"ME(N)"       },
  { id:"AH",  label:"AH!", full:"AH!"         }
];
const IDS = CHAPTERS.map(c => c.id);

/* Folder names are typed by hand, so accept the spellings you actually use. */
const CH_ALIAS = {
  phe:"PHE", "phē":"PHE", pheno:"PHE", phenomenah:"PHE",
  no:"NO",
  men:"MEN", "me(n)":"MEN", me:"MEN",
  ah:"AH", "ah!":"AH"
};

/* Captions written by hand, kept by filename. They survive a re-sync. */
const NOTES = {
  "CH.Phe.jpg": "Chapter page. Outline letters, lower left. The only mixed case in the book.",
  "SC1.#1.jpg": "[HE] boxed in the right margin. The spray runs to the trim.",
  "SC1.#2.jpg": "First answer — something answered, far below, unheard.",
  "SC2.#2.jpg": "Donut Spirit, first appearance. Cloud plate and the AH. signature. Carries —BIRD NOISE—.",
  "SC3.#1.jpg": "The bird leaves through the broken window and does not come back.",
  "SC3.#4.jpg": "Flowers and the PHE can. The first and only colour in the book.",
  "SC4.#3.jpg": "One line on an empty page. Second answer — another scratch.",
  "SC5.jpg":    "The record. Spiral text, read by turning the page. First AH! moment.",
  "SCard.WalkBoy.jpg":  "The plate. Untimed — no way to tell past, present or future.",
  "SCard.WalkBoy2.jpg": "The legend. 'Not a Walkman yet' is moving to the end of PHE."
};

const IMG_RE   = /\.(jpe?g|png)$/i;
const SKIP_RE  = /(^|\/)[._]|(^|\/)(back[ _-]?up|backup|archive|old|_to_delete)\//i;
const BLANK_RE = /^blank([ _-]?page)?$/i;
const FALLBACK_RATIO = 2000 / 2850;

/* ── state ───────────────────────────────────────────────────────── */
const KEY = "reahdim.arrangement.v2.";
let BOOK  = { PHE:[], NO:[], MEN:[], AH:[] };   // pages as read off the folder
let SEQ   = { PHE:[], NO:[], MEN:[], AH:[] };   // the arrangement, per chapter
let LOOSE = { PHE:[], NO:[], MEN:[], AH:[] };   // filenames with no readable position
let OUT   = { PHE:[], NO:[], MEN:[], AH:[] };   // pages taken out of the book by hand
let BLANK = null;                              // { blob, url, ratio } — the real blank page
let source = null;                             // { folder, when, count }
let chapter = "PHE";
let seq = SEQ.PHE;                             // live alias for the open chapter
let mode = "spread";
let cursor = 0;
let flipped = new Set();

function setSeq(arr){ SEQ[chapter] = arr; seq = arr; }
function pages(){ return BOOK[chapter]; }

/* ── ordering ─────────────────────────────────────────────────────
   The old rule matched SC<n> and SC<n>.#<n> and dumped everything else
   into a bucket that sorted after the cards — so SC3.#DRAW4 and
   SC2.#2.5 quietly ended up at the back of the book.

   This reads *every* number in the name instead of two fixed ones, and
   compares them as a tuple. [2,2] sorts before [2,2,5]: a page inserted
   as SC2.#2.5 lands after SC2.#2 rather than at the end. Letters in the
   name are no longer fatal — SC3.#DRAW4 is [3,4] and sits beside
   SC3.#4, broken by name.

   Only a name with no digits at all is "loose", and even that stays in
   the book — at the end of its chapter, counted out loud in the rail.
──────────────────────────────────────────────────────────────────── */
function baseName(n){ return n.replace(/\.[^.]+$/, ""); }

function keyOf(name){
  const b = baseName(name);
  const nums = (b.match(/\d+/g) || []).map(Number);
  let group = 3;
  /* Card is tested before SC: "SCard.WalkBoy" starts with "SC", so the
     looser test first would file every card as a scene and interleave the
     plates through the story. */
  if(/^CH([._\- ]|$)/i.test(b))          group = 0;   // the chapter plate opens its arc
  else if(/^S?Card([._\- ]|$)/i.test(b)) group = 2;   // cards and plates, after the scenes
  else if(/^SC/i.test(b))                group = 1;   // scenes
  return { group, nums, tag:b.toLowerCase(), loose: group === 3 && nums.length === 0 };
}
function cmpKey(a, b){
  if(a.group !== b.group) return a.group - b.group;
  const n = Math.max(a.nums.length, b.nums.length);
  for(let i = 0; i < n; i++){
    const x = a.nums[i], y = b.nums[i];
    if(x === undefined) return -1;                // the shorter name is the earlier page
    if(y === undefined) return 1;
    if(x !== y) return x - y;
  }
  return a.tag < b.tag ? -1 : a.tag > b.tag ? 1 : 0;
}

function deriveLabel(name){
  const b = baseName(name);
  let m;
  if((m = b.match(/^CH[._\- ]*(.*)$/i))) return "Chapter " + m[1].toUpperCase();
  if((m = b.match(/^SC[._\- ]*0*(\d+)(?:[._\- ]*#?\s*0*([A-Za-z]*\d*(?:\.\d+)?))?$/i))){
    const sub = m[2] ? String(m[2]).replace(/^0+(?=\d)/, "") : "";
    return "Scene " + (+m[1]) + (sub ? " · " + sub : "");
  }
  if((m = b.match(/^S?Card[._\- ]*(.*)$/i))){
    const raw = m[1], pm = raw.match(/^(.*?)[._\- #]*(\d+)$/);
    const who = (pm ? pm[1] : raw).replace(/[._-]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").trim();
    return "Card · " + who + (pm ? " · " + (+pm[2]) : "");
  }
  return b;
}

/* ── storage ─────────────────────────────────────────────────────── */
const DB = "reahdim", STORE = "sync";
function idb(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}
async function idbPut(k, v){
  try{
    const d = await idb();
    await new Promise((res, rej) => {
      const t = d.transaction(STORE, "readwrite");
      t.objectStore(STORE).put(v, k);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  }catch(e){ console.warn("REAHDIM: could not remember this sync —", e); }
}
async function idbGet(k){
  try{
    const d = await idb();
    return await new Promise((res, rej) => {
      const t = d.transaction(STORE, "readonly");
      const rq = t.objectStore(STORE).get(k);
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
  }catch(e){ return undefined; }
}

/* Pages are kept as blobs, not as base64 strings — a data URL costs a
   third again in size and has to be parsed on every paint. */
function mintUrls(){
  IDS.forEach(id => BOOK[id].forEach(p => { if(!p.url && p.blob) p.url = URL.createObjectURL(p.blob); }));
  if(BLANK && !BLANK.url && BLANK.blob) BLANK.url = URL.createObjectURL(BLANK.blob);
}
function strip(p){ return { file:p.file, label:p.label, note:p.note, grid:p.grid, ratio:p.ratio, blob:p.blob }; }
async function remember(){
  await idbPut("book", {
    chapters: Object.fromEntries(IDS.map(id => [id, BOOK[id].map(strip)])),
    loose: LOOSE,
    blank: BLANK ? { blob:BLANK.blob, ratio:BLANK.ratio } : null,
    source
  });
}

/* ── the arrangement ─────────────────────────────────────────────── */
function blankEntry(){
  return { blank:true, ratio: BLANK ? BLANK.ratio : FALLBACK_RATIO, url: BLANK ? BLANK.url : null };
}
function entryOf(p){ return { ...p, blank:false }; }

/* Rebuild one chapter's arrangement from what was saved. Any page the
   folder has now that the saved order did not know about is appended
   rather than dropped — a re-sync can add pages, never lose them. */
function loadArrangement(id){
  const list = BOOK[id];
  try{
    const raw = localStorage.getItem(KEY + id);
    if(raw){
      const saved = JSON.parse(raw);
      /* Older saves were a bare array. A save now also carries the pages
         taken out by hand, because otherwise the rule that a re-sync
         never loses a page would quietly put every one of them back. */
      const arr = Array.isArray(saved) ? saved : (saved && saved.order) || null;
      OUT[id] = (!Array.isArray(saved) && saved && Array.isArray(saved.out)) ? saved.out : [];
      const out_ = new Set(OUT[id]);
      if(Array.isArray(arr) && arr.length){
        const byFile = new Map(list.map(p => [p.file, p]));
        const used = new Set(), out = [];
        for(const x of arr){
          if(x === null){ out.push(blankEntry()); continue; }
          const p = byFile.get(x);
          if(p && !used.has(x)){ out.push(entryOf(p)); used.add(x); }
        }
        list.forEach(p => { if(!used.has(p.file) && !out_.has(p.file)) out.push(entryOf(p)); });
        if(out.length) return out;
      }
    }
  }catch(e){}
  return list.map(entryOf);
}
function saveArrangement(){
  try{
    localStorage.setItem(KEY + chapter, JSON.stringify({
      order: seq.map(p => p.blank ? null : p.file),
      out:   OUT[chapter] || []
    }));
  }catch(e){}
}
function loadAll(){
  IDS.forEach(id => { SEQ[id] = loadArrangement(id); });
  seq = SEQ[chapter];
}

/* ── reading the folder ──────────────────────────────────────────── */
function syncUI(on, title, sub, pct){
  const el = document.getElementById("syncing");
  el.classList.toggle("on", on);
  if(title) document.getElementById("sync-title").textContent = title;
  if(sub !== undefined) document.getElementById("sync-sub").textContent = sub;
  if(pct !== undefined) document.getElementById("sync-bar").style.width = pct + "%";
}

/* Downscale for the screen and measure the ink in one pass. The scan on
   disk is never modified and never uploaded. */
async function readPage(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i); i.onerror = () => rej(new Error("decode"));
      i.src = url;
    });
    const ratio = img.width / img.height;         // the page's own shape, not an assumed one
    const H = 1500, W = Math.max(1, Math.round(H * ratio));
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const cx = c.getContext("2d");
    cx.imageSmoothingQuality = "high";
    cx.drawImage(img, 0, 0, W, H);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));

    const gw = 90, gh = Math.max(1, Math.round(gw / ratio));
    const gc = document.createElement("canvas"); gc.width = gw; gc.height = gh;
    const gx = gc.getContext("2d"); gx.drawImage(img, 0, 0, gw, gh);
    const d = gx.getImageData(0, 0, gw, gh).data;
    const lum = new Float32Array(gw * gh);
    for(let p = 0, q = 0; p < d.length; p += 4, q++) lum[q] = .299*d[p] + .587*d[p+1] + .114*d[p+2];
    const sorted = Array.from(lum).sort((a, b) => a - b);
    const paper = sorted[Math.floor(sorted.length * 0.9)] || 255;
    const grid = [];
    for(let ry = 0; ry < 3; ry++){
      const row = [];
      for(let rx = 0; rx < 3; rx++){
        let tot = 0, n = 0;
        const y0 = Math.floor(ry*gh/3), y1 = Math.floor((ry+1)*gh/3);
        const x0 = Math.floor(rx*gw/3), x1 = Math.floor((rx+1)*gw/3);
        for(let y = y0; y < y1; y++)
          for(let x = x0; x < x1; x++){ tot += Math.max(0, paper - lum[y*gw + x]); n++; }
        row.push(Math.round(Math.min(100, (tot/Math.max(1,n))/paper*100*3.2)));
      }
      grid.push(row);
    }
    return { blob, grid, ratio };
  } finally { URL.revokeObjectURL(url); }
}

function chapterFor(relParts){
  if(relParts.length > 1){
    const seg = relParts[0].toLowerCase().trim();
    const hit = CH_ALIAS[seg] || CH_ALIAS[seg.replace(/[^a-z()!]/g, "")];
    if(hit) return { id:hit, known:true };
    return { id:"PHE", known:false };            // an unnamed subfolder: kept, flagged
  }
  return { id:"PHE", known:true };               // loose at the top level
}

async function syncFolder(fileList){
  const all = Array.from(fileList);
  if(!all.length) return;

  const root = (all[0].webkitRelativePath || "").split("/")[0] || "folder";
  const buckets = { PHE:[], NO:[], MEN:[], AH:[] };
  const loose = { PHE:[], NO:[], MEN:[], AH:[] };
  let blankFile = null;

  for(const f of all){
    const rel = f.webkitRelativePath || f.name;
    const parts = rel.split("/").slice(1);       // drop the picked folder's own name
    if(!parts.length) continue;
    if(SKIP_RE.test("/" + parts.join("/"))) continue;
    const name = parts[parts.length - 1];
    if(!IMG_RE.test(name)) continue;
    if(BLANK_RE.test(baseName(name))){ if(!blankFile) blankFile = f; continue; }
    const { id, known } = chapterFor(parts);
    const k = keyOf(name);
    buckets[id].push({ f, name, key:k, path:parts.join("/") });
    if(k.loose || !known) loose[id].push(parts.join("/"));
  }

  const total = IDS.reduce((n, id) => n + buckets[id].length, 0);
  if(!total){
    syncUI(true, "Nothing to read",
      "No page images under that folder. Pick the folder that holds the scans — the one with PHE, NO, MEN, AH inside it.", 0);
    setTimeout(() => syncUI(false), 3400);
    return;
  }

  IDS.forEach(id => buckets[id].sort((a, b) => cmpKey(a.key, b.key)));

  syncUI(true, "Reading the folder", "", 0);
  const next = { PHE:[], NO:[], MEN:[], AH:[] };
  let done = 0;

  for(const id of IDS){
    for(const item of buckets[id]){
      syncUI(true, "Reading the folder",
        id + "  ·  " + item.name + "  ·  " + (done+1) + " of " + total,
        Math.round(done / total * 100));
      await new Promise(r => setTimeout(r, 0));
      try{
        const { blob, grid, ratio } = await readPage(item.f);
        next[id].push({ file:item.name, label:deriveLabel(item.name),
                        note:NOTES[item.name] || "", grid, ratio, blob });
      }catch(e){ console.warn("REAHDIM: could not read", item.path, e); }
      done++;
    }
  }
  syncUI(true, "Reading the folder", "", 100);

  if(blankFile){
    try{
      const { blob, ratio } = await readPage(blankFile);
      if(BLANK && BLANK.url) URL.revokeObjectURL(BLANK.url);
      BLANK = { blob, ratio, url:null };
    }catch(e){}
  }

  IDS.forEach(id => BOOK[id].forEach(p => { if(p.url) URL.revokeObjectURL(p.url); }));
  BOOK = next; LOOSE = loose;
  source = { folder:root, when:Date.now(), count:total };
  mintUrls();
  loadAll();                                     // keeps blanks and any hand order that still fits
  if(!SEQ[chapter].length) chapter = IDS.find(id => SEQ[id].length) || "PHE";
  seq = SEQ[chapter];
  cursor = 0; flipped = new Set();
  document.getElementById("consequence").classList.remove("on");

  await remember();
  syncUI(false);
  render();
}

document.getElementById("btn-sync").onclick = () => document.getElementById("folder").click();
document.getElementById("folder").onchange = e => { syncFolder(e.target.files); e.target.value = ""; };

/* ── pagination model ─────────────────────────────────────────────
   page 1 is a recto. odd = recto (right), even = verso (left).
   spread n pairs pages 2n and 2n+1. page 1 sits alone.
──────────────────────────────────────────────────────────────────── */
const pageNo   = i => i + 1;
const isRecto  = i => pageNo(i) % 2 === 1;
const sideOf   = i => isRecto(i) ? "recto" : "verso";
const spreadNo = i => Math.floor(pageNo(i) / 2);

function snapshotSides(){ return seq.map((p, i) => sideOf(i)); }
function idOf(p){ return p.blank ? "_blank_" : p.file; }
function beforeState(){ return { ids: seq.map(idOf), sides: snapshotSides() }; }

function applyChange(before, verb){
  const after = snapshotSides();
  flipped = new Set();
  const afterIds = seq.map(idOf);
  let changed = 0;
  afterIds.forEach((id, i) => {
    if(id === "_blank_") return;                 // blanks have no identity to follow
    const j = before.ids.indexOf(id);
    if(j > -1 && before.sides[j] !== after[i]){ flipped.add(i); changed++; }
  });
  const spreads = new Set([...flipped].map(spreadNo)).size;
  showConsequence(changed, spreads, verb);
}
function showConsequence(changed, spreads, verb){
  const el = document.getElementById("consequence");
  const t  = document.getElementById("consequence-text");
  t.innerHTML = changed === 0
    ? `<b>${verb}.</b> Nothing downstream changed side.`
    : `<b>${verb}.</b> ${changed} page${changed===1?"":"s"} changed side &middot; ${spreads} spread${spreads===1?"":"s"} re-paired. Every relationship after this point is different.`;
  el.classList.add("on");
}
document.getElementById("consequence-close").onclick = () => {
  document.getElementById("consequence").classList.remove("on");
  flipped = new Set(); render();
};

/* ── mutations ───────────────────────────────────────────────────── */
function insertBlank(at){
  const b = beforeState();
  seq.splice(at, 0, blankEntry());
  if(cursor >= at) cursor++;
  applyChange(b, "Blank inserted");
  saveArrangement(); render();
}
/* Taking a page out of the book is not deleting it. The file stays in
   the folder, untouched; it is this arrangement that no longer uses it,
   and the rail says so and offers it back. */
function removeAt(i){
  const p = seq[i];
  if(!p) return;
  const b = beforeState();
  seq.splice(i, 1);
  if(!p.blank && p.file){
    OUT[chapter] = OUT[chapter] || [];
    if(!OUT[chapter].includes(p.file)) OUT[chapter].push(p.file);
  }
  if(cursor > i) cursor--;
  if(cursor >= seq.length) cursor = seq.length - 1;
  if(cursor < 0) cursor = 0;
  applyChange(b, p.blank ? "Blank removed" : "Page taken out");
  saveArrangement(); render();
}

function restoreOut(){
  const names = OUT[chapter] || [];
  if(!names.length) return;
  const b = beforeState();
  const byFile = new Map(pages().map(x => [x.file, x]));
  names.forEach(n => { const x = byFile.get(n); if(x) seq.push(entryOf(x)); });
  OUT[chapter] = [];
  applyChange(b, names.length + " page(s) put back");
  saveArrangement(); render();
}

/* Move a page to a new slot. `to` is an insertion point measured in the
   list as it stands *before* the page is lifted out, which is what the
   drop indicator between two chips means. */
function moveEntry(from, to){
  if(from === to || from === to - 1) return;
  const b = beforeState();
  const [it] = seq.splice(from, 1);
  const at = to > from ? to - 1 : to;
  seq.splice(at, 0, it);
  cursor = at;
  applyChange(b, it.blank ? "Blank moved" : "Page moved");
  saveArrangement(); render();
}

document.getElementById("btn-blank").onclick = () => {
  if(!seq.length) return;
  insertBlank(cursor + 1);
  cursor = Math.min(seq.length - 1, cursor + 1);   // land on it, ready to drag
  render();
};
document.getElementById("btn-remove").onclick = () => {
  if(seq.length) removeAt(cursor);
};
document.getElementById("restore").onclick = () => restoreOut();

/* ── weight meter ────────────────────────────────────────────────── */
function mass(p){
  if(p.blank || !p.grid) return null;
  let tot = 0, cx = 0, cy = 0;
  for(let r = 0; r < 3; r++) for(let c = 0; c < 3; c++){
    const w = p.grid[r][c]; tot += w;
    cx += w * ((c+0.5)/3); cy += w * ((r+0.5)/3);
  }
  if(!tot) return null;
  return { x:cx/tot, y:cy/tot, total:tot };
}
function zone(m){
  const v = m.y < .38 ? "top" : m.y > .62 ? "bottom" : "middle";
  const h = m.x < .40 ? "left" : m.x > .60 ? "right" : "centre";
  return v === "middle" && h === "centre" ? "centred" : `${v} ${h}`;
}
function weightEl(p){
  const m = mass(p);
  const d = document.createElement("div"); d.className = "weight";
  const box = document.createElement("div"); box.className = "wbox";
  if(m){
    const i = document.createElement("i");
    i.style.left = (m.x*100)+"%"; i.style.top = (m.y*100)+"%";
    const s = Math.max(4, Math.min(9, 3 + m.total/45));
    i.style.width = s+"px"; i.style.height = s+"px";
    box.appendChild(i);
  }
  const t = document.createElement("span"); t.className = "wtxt";
  t.textContent = m ? zone(m) : "empty";
  d.append(box, t); d.title = "Centre of ink, measured off the scan";
  return d;
}

/* ── rendering ───────────────────────────────────────────────────
   Every page carries the aspect its own scan had. Nothing is forced
   into a shared box, so nothing is stretched and nothing is cropped —
   a page drawn on a different sheet simply is a different shape.
──────────────────────────────────────────────────────────────────── */
function ratioOf(p){ return (p && p.ratio) || FALLBACK_RATIO; }
const slotW = (h, p) => Math.round(h * ratioOf(p));

function slotEl(i, opts = {}){
  const s = document.createElement("div");
  s.className = "slot" + (i === null ? " empty" : "");
  const p = seq[i === null ? 0 : i];
  s.style.width = slotW(opts.h, p) + "px";
  s.appendChild(pageEl(i === null ? 0 : i, opts));
  return s;
}

function pageEl(i, opts = {}){
  const p = seq[i];
  const h = opts.h || 420;
  const wrap = document.createElement("div");
  wrap.className = "page" + (p.blank ? " blank" : "") + (p.blank && !p.url ? " noimg" : "");

  if(p.blank && !p.url){
    const box = document.createElement("div");
    box.className = "page-img";
    box.style.width = slotW(h, p) + "px"; box.style.height = h + "px";
    box.innerHTML = '<span class="blank-mark">Blank</span>';
    wrap.appendChild(box);
  }else{
    const img = document.createElement("img");
    img.className = "page-img"; img.src = p.url; img.alt = p.blank ? "Blank page" : p.label;
    img.style.height = h + "px"; img.style.width = slotW(h, p) + "px";
    wrap.appendChild(img);
  }

  const foot = document.createElement("div"); foot.className = "page-foot";
  const n = document.createElement("span"); n.className = "pnum mono"; n.textContent = pageNo(i);
  const s = document.createElement("span"); s.className = "pside"; s.textContent = sideOf(i);
  foot.append(n, s);
  if(p.blank){
    const l = document.createElement("span"); l.className = "plabel"; l.textContent = "Blank";
    foot.append(l);
  }else if(!opts.masked){
    const l = document.createElement("span"); l.className = "plabel"; l.textContent = p.label;
    foot.append(l, weightEl(p));
  }
  wrap.appendChild(foot);

  if(!p.blank && p.note && opts.note !== false){
    const nt = document.createElement("div"); nt.className = "pnote"; nt.textContent = p.note;
    wrap.appendChild(nt);
  }

  ["before", "after"].forEach(which => {
    const box = document.createElement("div"); box.className = "ins " + which;
    const b = document.createElement("button");
    b.textContent = "+"; b.title = "Insert blank " + which + " page " + pageNo(i);
    b.setAttribute("aria-label", b.title);
    b.onclick = e => { e.stopPropagation(); insertBlank(which === "before" ? i : i+1); };
    box.appendChild(b); wrap.appendChild(box);
  });
  return wrap;
}

function bottomFlag(a, b){
  if(!a || a.blank || !b || b.blank) return null;
  const ma = mass(a), mb = mass(b);
  if(!ma || !mb) return null;
  if(ma.y > .60 && mb.y > .60){
    const f = document.createElement("div"); f.className = "flag";
    f.textContent = "Both pages weight the bottom of the spread";
    return f;
  }
  return null;
}
function gutterEl(H){
  const g = document.createElement("div"); g.className = "gutter";
  g.style.height = H + "px";
  return g;
}

function nothingEl(){
  const d = document.createElement("div"); d.className = "nothing";
  const b = document.createElement("b"); b.textContent = "No pages yet";
  const p = document.createElement("p");
  p.innerHTML = "Nothing is built into this file. Point it at your drawing folder — " +
                "the one holding <code>PHE/</code>, <code>NO/</code>, <code>MEN/</code>, <code>AH/</code> " +
                "and <code>Blank_Page.jpg</code> — and it reads the pages straight off the disk.";
  const g = document.createElement("button"); g.className = "go"; g.textContent = "Sync folder";
  g.onclick = () => document.getElementById("folder").click();
  d.append(b, p, g);
  return d;
}

function render(){
  const sheets = document.getElementById("sheets");
  const status = document.getElementById("status");
  sheets.innerHTML = ""; status.innerHTML = "";

  renderChapters();
  document.getElementById("chap-full").textContent =
    (CHAPTERS.find(c => c.id === chapter) || CHAPTERS[0]).full;

  if(!seq.length){
    sheets.appendChild(nothingEl());
    document.getElementById("prev").disabled = true;
    document.getElementById("next").disabled = true;
    renderMeta(); renderRibbon(); renderSheet();
    return;
  }

  if(cursor < 0) cursor = 0;
  if(cursor > seq.length - 1) cursor = seq.length - 1;

  const banner = document.getElementById("consequence").classList.contains("on") ? 37 : 0;
  const chrome = 108 /*ribbon*/ + 32 /*stage pad*/ + 22 /*foot*/ + 32 /*note*/ + 14 /*gaps*/;
  const byHeight = window.innerHeight - chrome - banner;
  const room = window.innerWidth - 2*126;        // never let the book grow under the rail

  /* Height is chosen against the widest page actually on screen, so a
     landscape page cannot push its neighbour off the stage. */
  const inView = mode === "single" ? [seq[cursor]]
    : (() => { const sp = spreadNo(cursor);
        return sp === 0 ? [seq[0]] : [seq[sp*2-1], seq[sp*2]]; })();
  const widest = Math.max(...inView.filter(Boolean).map(ratioOf), 0.3);
  const byWidth = (mode === "single" ? room : (room - 18) / 2) / widest;
  const H = Math.max(240, Math.min(mode === "single" ? 980 : 900, byHeight, byWidth));

  sheets.className = "sheets" + (mode === "wall" ? " wall" : "");
  document.querySelector(".stage").classList.toggle("wallmode", mode === "wall");

  if(mode === "single"){
    sheets.appendChild(slotEl(cursor, { h:H }));

  }else if(mode === "spread"){
    const sp = spreadNo(cursor);
    let left = null, right = null;
    if(sp === 0){ right = 0; } else { left = sp*2 - 1; right = sp*2; }
    const hasL = left !== null && left < seq.length;
    const hasR = right !== null && right < seq.length;
    sheets.appendChild(slotEl(hasL ? left : null, { h:H }));
    sheets.appendChild(gutterEl(H));
    sheets.appendChild(slotEl(hasR ? right : null, { h:H }));
    const fl = bottomFlag(hasL ? seq[left] : null, hasR ? seq[right] : null);
    if(fl) status.appendChild(fl);

  }else{
    renderWall(sheets, H);
  }

  document.getElementById("prev").disabled = cursor <= 0;
  document.getElementById("next").disabled = cursor >= seq.length - 1;

  renderMeta(); renderRibbon(); renderSheet();
}

/* ── the wall ──────────────────────────────────────────────────────
   Every spread in the chapter at once, about half stage size. Spreads
   keep their pairing and their gutter, so this is the book seen from
   above rather than a pile of loose pages — which is the only version
   worth having when the question is how a whole chapter paces.
─────────────────────────────────────────────────────────────────── */
function wallPage(i, h){
  const p = seq[i];
  const d = document.createElement("div");
  d.className = "wallpage" + (i === cursor ? " here" : "");
  d.title = (p.blank ? "Blank" : (p.label || p.file)) + " — page " + pageNo(i) + ", " + sideOf(i);

  const w = slotW(h, p);
  if(p.blank && !p.url){
    const b = document.createElement("div"); b.className = "blanktile";
    b.style.width = w + "px"; b.style.height = h + "px";
    d.appendChild(b);
  }else{
    const im = document.createElement("img");
    im.src = p.url; im.alt = p.blank ? "Blank page" : (p.label || "");
    im.style.width = w + "px"; im.style.height = h + "px";
    im.draggable = false;
    d.appendChild(im);
  }
  const cap = document.createElement("div"); cap.className = "cap";
  const n = document.createElement("span"); n.textContent = pageNo(i);
  const sd = document.createElement("span"); sd.textContent = isRecto(i) ? "R" : "L";
  cap.append(n, sd);
  d.appendChild(cap);

  /* Click puts the cursor here; clicking the one already selected opens
     its spread on the stage — so the wall is a way in, not a dead end. */
  d.onclick = () => {
    if(i === cursor) setMode("spread");
    else { cursor = i; render(); }
  };
  return d;
}

function renderWall(sheets, H){
  const h = Math.max(140, Math.min(320, Math.round(H / 2)));
  let i = 0;
  while(i < seq.length){
    const sp = spreadNo(i);
    const grp = document.createElement("div");
    grp.className = "wallgrp";
    grp.dataset.spread = sp === 0 ? "OPEN" : String(sp).padStart(2, "0");
    if(sp === 0){
      grp.appendChild(wallPage(i, h)); i++;
    }else{
      grp.appendChild(wallPage(i, h));
      const gut = document.createElement("div"); gut.className = "wallgut";
      grp.appendChild(gut);
      if(seq[i+1] && spreadNo(i+1) === sp){ grp.appendChild(wallPage(i+1, h)); i += 2; }
      else i += 1;
    }
    sheets.appendChild(grp);
  }
}

function renderChapters(){
  const box = document.getElementById("chapters");
  box.innerHTML = "";
  CHAPTERS.forEach(c => {
    const n = SEQ[c.id].length;
    const b = document.createElement("button");
    b.className = "chapbtn" + (n ? "" : " empty");
    b.setAttribute("aria-pressed", String(c.id === chapter));
    b.innerHTML = `<span>${c.label}</span><span class="n">${n || "—"}</span>`;
    b.title = n ? `${c.label} — ${n} pages` : `${c.label} — no pages in the folder yet`;
    b.onclick = () => setChapter(c.id);
    box.appendChild(b);
  });
}

function renderMeta(){
  const blanks = seq.filter(p => p.blank).length;
  const spreads = Math.floor(seq.length / 2);
  document.getElementById("count").innerHTML =
    `${seq.length} pages<br>${spreads} spreads` + (blanks ? `<br>${blanks} blank` : "");

  const lo = LOOSE[chapter] || [];
  const el = document.getElementById("loose");
  if(lo.length){
    el.textContent = lo.length + " loose";
    el.title = "Kept, at the end of the chapter — I could not read a position from these names:\n  " +
               lo.join("\n  ");
  }else{ el.textContent = ""; el.title = ""; }

  const cur = seq[cursor];
  const sel = document.getElementById("selline");
  sel.innerHTML = cur
    ? "Selected<br>" + (cur.blank ? "blank" : (cur.label || cur.file)) + "<br>page " + pageNo(cursor)
    : "";
  document.getElementById("btn-remove").disabled = !cur;
  document.getElementById("btn-blank").disabled  = !seq.length;

  const out = OUT[chapter] || [];
  const rs = document.getElementById("restore");
  rs.hidden = !out.length;
  if(out.length){
    rs.textContent = out.length + " out · put back";
    rs.title = "Taken out of the book (the files are untouched):\n  " + out.join("\n  ");
  }

  const sl = document.getElementById("srcline");
  sl.classList.toggle("synced", !!source);
  if(source){
    const t = new Date(source.when);
    sl.innerHTML = "Synced<br>" + source.folder + "<br>" +
      String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
    sl.title = "Read from the folder. Click Sync folder again after you draw.";
  }else{
    sl.textContent = "Not synced";
    sl.title = "No folder read yet.";
  }
}

/* ── ribbon ──────────────────────────────────────────────────────── */
let dragFrom = null, dropAt = null;

function renderRibbon(){
  const rib = document.getElementById("ribbon");
  rib.innerHTML = ""; rib.classList.remove("dragging");
  let i = 0;
  while(i < seq.length){
    const sp = spreadNo(i);
    const grp = document.createElement("div");
    grp.className = "spreadgrp" + (sp === 0 ? " solo" : "");
    grp.dataset.spread = sp === 0 ? "OPEN" : String(sp).padStart(2, "0");

    const members = [];
    if(sp === 0){ members.push(i); i++; }
    else { members.push(i); if(seq[i+1] && spreadNo(i+1) === sp) members.push(i+1); i += members.length; }

    members.forEach(k => grp.appendChild(chipEl(k)));
    rib.appendChild(grp);
  }
  const cur = rib.querySelector('[aria-current="true"]');
  if(cur) cur.scrollIntoView({ block:"nearest", inline:"nearest" });
}

function clearDrop(){
  document.querySelectorAll(".chip.dropL,.chip.dropR")
    .forEach(c => c.classList.remove("dropL", "dropR"));
}

function chipEl(i){
  const p = seq[i];
  const c = document.createElement("button");
  c.className = "chip " + sideOf(i) + (p.blank ? " isblank" : "") + (flipped.has(i) ? " flipped" : "");
  c.setAttribute("aria-current", String(i === cursor));
  c.title = (p.blank ? "Blank" : p.label) + " — page " + pageNo(i) + ", " + sideOf(i) + "  ·  drag to move";

  if(p.blank && !p.url){
    const b = document.createElement("div"); b.className = "blankbox"; c.appendChild(b);
  }else{
    const im = document.createElement("img"); im.src = p.url; im.alt = ""; im.draggable = false;
    c.appendChild(im);
  }
  const n = document.createElement("span"); n.className = "cn"; n.textContent = pageNo(i);
  const s = document.createElement("span"); s.className = "cs"; s.textContent = isRecto(i) ? "R" : "L";
  c.append(n, s);
  c.onclick = () => { cursor = i; render(); };

  if(p.blank){
    const d = document.createElement("span"); d.className = "chipdel"; d.textContent = "×";
    d.title = "Remove blank";
    d.onclick = e => { e.stopPropagation(); removeAt(i); };
    c.appendChild(d);
  }

  /* Drag to reorder. The drop indicator sits on the edge of a chip, so
     you are aiming at the gap between two pages, not at a page. */
  c.draggable = true;
  c.addEventListener("dragstart", e => {
    dragFrom = i; dropAt = null;
    c.classList.add("dragging");
    document.getElementById("ribbon").classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", String(i)); }catch(err){}
  });
  c.addEventListener("dragend", () => {
    c.classList.remove("dragging");
    document.getElementById("ribbon").classList.remove("dragging");
    clearDrop(); dragFrom = null; dropAt = null;
  });
  c.addEventListener("dragover", e => {
    if(dragFrom === null) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    const r = c.getBoundingClientRect();
    const after = e.clientX > r.left + r.width/2;
    clearDrop();
    c.classList.add(after ? "dropR" : "dropL");
    dropAt = after ? i + 1 : i;
  });
  c.addEventListener("drop", e => {
    e.preventDefault(); e.stopPropagation();
    if(dragFrom !== null && dropAt !== null) moveEntry(dragFrom, dropAt);
    clearDrop(); dragFrom = null; dropAt = null;
  });
  return c;
}

/* ── arrangement sheet ───────────────────────────────────────────── */
function cell(i){
  const p = seq[i];
  return `${String(pageNo(i)).padStart(2, " ")} ${p.blank ? "— blank —" : p.file}`;
}
function pad(s){ return s + " ".repeat(Math.max(0, 26 - s.length)); }

function renderSheet(){
  const lines = [`${chapter}  ·  ${seq.length} pages`, ""];
  let i = 0;
  while(i < seq.length){
    const sp = spreadNo(i);
    if(sp === 0){ lines.push(`OPEN            .  |  ${cell(0)}`); i++; }
    else{
      const l = seq[i] ? cell(i) : "";
      const r = seq[i+1] && spreadNo(i+1) === sp ? cell(i+1) : "";
      lines.push(`SPREAD ${String(sp).padStart(2,"0")}   ${pad(l)}  |  ${r}`);
      i += r ? 2 : 1;
    }
  }
  const lo = LOOSE[chapter] || [];
  if(lo.length) lines.push("", "no position read from: " + lo.join(", "));
  document.getElementById("sheet-text").textContent = lines.join("\n");
}

/* ── export ────────────────────────────────────────────────────────
   A reading PDF of the open chapter: one page per page, blanks
   included, in the order the arrangement says.

   The pages here are the ones the sync downscaled to 1500px for the
   screen — the browser let go of the files the moment it finished
   reading them and cannot reopen the originals. Good for reading and
   sending; the desktop app is the one that exports at print size, and
   the bar says so rather than letting you find out later.

   The writer is hand-rolled: a JPEG goes in byte-for-byte as DCTDecode
   rather than through a canvas, so nothing is compressed twice.
─────────────────────────────────────────────────────────────────── */
const PDF_H = 792;                              // page height in points

function jpegInfo(bytes){
  if(bytes[0] !== 0xFF || bytes[1] !== 0xD8) return null;
  let i = 2;
  while(i < bytes.length - 1){
    if(bytes[i] !== 0xFF){ i++; continue; }
    const marker = bytes[i+1];
    if(marker === 0xFF){ i++; continue; }
    if(marker === 0x01 || (marker >= 0xD0 && marker <= 0xD9)){ i += 2; continue; }
    const len = (bytes[i+2] << 8) | bytes[i+3];
    const isSOF = marker >= 0xC0 && marker <= 0xCF && marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC;
    if(isSOF){
      const progressive = (marker === 0xC2 || marker === 0xC6 || marker === 0xCA || marker === 0xCE);
      return { h:(bytes[i+5] << 8) | bytes[i+6], w:(bytes[i+7] << 8) | bytes[i+8],
               nc:bytes[i+9], progressive };
    }
    if(marker === 0xDA) break;                   // start of scan, no frame header before it
    i += 2 + len;
  }
  return null;
}

/* A PNG, or a progressive JPEG the PDF filter will not take, goes
   through a canvas once. 4000px is the canvas ceiling, not a choice. */
async function toBaselineJpeg(blob){
  const url = URL.createObjectURL(blob);
  try{
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("decode")); i.src = url;
    });
    const CAP = 4000, sc = Math.min(CAP/img.width, CAP/img.height, 1);
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.width*sc)); c.height = Math.max(1, Math.round(img.height*sc));
    const x = c.getContext("2d");
    x.fillStyle = "#ffffff"; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(img, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, "image/jpeg", 0.92));
    return new Uint8Array(await out.arrayBuffer());
  } finally { URL.revokeObjectURL(url); }
}

async function pdfImage(blob){
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const info = jpegInfo(bytes);
  if(info && !info.progressive && (info.nc === 1 || info.nc === 3))
    return { bytes, w:info.w, h:info.h, nc:info.nc };
  const re = await toBaselineJpeg(blob);
  const ri = jpegInfo(re);
  if(!ri) throw new Error("could not encode a page");
  return { bytes:re, w:ri.w, h:ri.h, nc:ri.nc };
}

/* A blank with no Blank_Page.jpg behind it still has to be a real sheet
   in the file, or the pagination this whole tool is about collapses on
   export. */
async function whiteSheet(ratio){
  const c = document.createElement("canvas");
  c.width = Math.round(1200 * ratio); c.height = 1200;
  const x = c.getContext("2d"); x.fillStyle = "#ffffff"; x.fillRect(0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
}

function buildPdf(items){
  const chunks = []; let len = 0; const off = {};
  const enc = t => { const a = new Uint8Array(t.length); for(let i=0;i<t.length;i++) a[i] = t.charCodeAt(i) & 255; return a; };
  const put = x => { const b = (typeof x === "string") ? enc(x) : x; chunks.push(b); len += b.length; };
  const startObj = n => { off[n] = len; put(n + " 0 obj\n"); };
  const endObj = () => put("\nendobj\n");
  const f = n => (Math.round(n*1000)/1000).toString();

  put("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const total = 2 + items.length*3;
  const kids = items.map((_, i) => (3 + 3*i) + " 0 R").join(" ");

  startObj(1); put("<< /Type /Catalog /Pages 2 0 R >>"); endObj();
  startObj(2); put("<< /Type /Pages /Count " + items.length + " /Kids [" + kids + "] >>"); endObj();

  items.forEach((it, i) => {
    const pN = 3 + 3*i, cN = 4 + 3*i, iN = 5 + 3*i;
    startObj(pN);
    put("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + f(it.pw) + " " + f(it.ph) + "]" +
        " /Resources << /XObject << /Im0 " + iN + " 0 R >> >> /Contents " + cN + " 0 R >>");
    endObj();
    const cs = "q " + f(it.pw) + " 0 0 " + f(it.ph) + " 0 0 cm /Im0 Do Q";
    startObj(cN); put("<< /Length " + cs.length + " >>\nstream\n" + cs + "\nendstream"); endObj();
    startObj(iN);
    put("<< /Type /XObject /Subtype /Image /Width " + it.w + " /Height " + it.h +
        " /ColorSpace " + (it.nc === 1 ? "/DeviceGray" : "/DeviceRGB") +
        " /BitsPerComponent 8 /Filter /DCTDecode /Length " + it.bytes.length + " >>\nstream\n");
    put(it.bytes); put("\nendstream"); endObj();
  });

  const xrefAt = len;
  let x = "xref\n0 " + (total+1) + "\n0000000000 65535 f \n";
  for(let n = 1; n <= total; n++) x += String(off[n]).padStart(10, "0") + " 00000 n \n";
  put(x);
  put("trailer\n<< /Size " + (total+1) + " /Root 1 0 R >>\nstartxref\n" + xrefAt + "\n%%EOF\n");

  const out = new Uint8Array(len); let q = 0;
  chunks.forEach(b => { out.set(b, q); q += b.length; });
  return out;
}

let lastPdf = null;                              // { url, name }

async function exportPdf(){
  if(!seq.length) return;
  const items = [];
  for(let i = 0; i < seq.length; i++){
    const p = seq[i];
    syncUI(true, "Writing the PDF",
      (p.blank ? "blank" : p.file) + "  ·  " + (i+1) + " of " + seq.length,
      Math.round(i/seq.length*100));
    await new Promise(r => setTimeout(r, 0));
    try{
      const blob = p.blank ? (BLANK && BLANK.blob ? BLANK.blob : await whiteSheet(ratioOf(p)))
                           : p.blob;
      if(!blob) continue;
      const im = await pdfImage(blob);
      items.push({ ...im, pw: PDF_H * (im.w / im.h), ph: PDF_H });
    }catch(e){ console.warn("REAHDIM: page left out of the PDF —", p.file, e); }
  }
  if(!items.length){ syncUI(false); return; }

  syncUI(true, "Writing the PDF", "", 100);
  const bytes = buildPdf(items);
  if(lastPdf && lastPdf.url) URL.revokeObjectURL(lastPdf.url);
  const url = URL.createObjectURL(new Blob([bytes], { type:"application/pdf" }));
  const name = "REAHDIM — " + chapter + " — " +
    new Date().toISOString().slice(0,10);
  lastPdf = { url, name };
  syncUI(false);

  document.getElementById("pdf-frame").src = url;
  document.getElementById("pdf-title").textContent = name + "  ·  " + items.length + " pages";
  document.getElementById("pdf-note").textContent =
    "screen resolution — the browser cannot reopen your originals";
  document.getElementById("pdfwrap").classList.add("on");
}

function closePdf(){
  document.getElementById("pdfwrap").classList.remove("on");
  document.getElementById("pdf-frame").src = "about:blank";
}
document.getElementById("btn-export").onclick = () => exportPdf();
document.getElementById("pdf-close").onclick  = closePdf;
document.getElementById("pdf-save").onclick   = () => {
  if(!lastPdf) return;
  const a = document.createElement("a");
  a.href = lastPdf.url; a.download = lastPdf.name + ".pdf";
  document.body.appendChild(a); a.click(); a.remove();
};

/* ── controls ────────────────────────────────────────────────────── */
function setChapter(id){
  if(!IDS.includes(id) || id === chapter) return;
  chapter = id; seq = SEQ[id];
  cursor = 0; flipped = new Set();
  document.getElementById("consequence").classList.remove("on");
  render();
}
function setMode(m){
  mode = m;
  ["single","spread","wall"].forEach(x =>
    document.getElementById("m-" + x).setAttribute("aria-pressed", String(x === m)));
  render();
}
document.getElementById("m-single").onclick = () => setMode("single");
document.getElementById("m-spread").onclick = () => setMode("spread");
document.getElementById("m-wall").onclick   = () => setMode("wall");

function step(d){
  if(!seq.length) return;
  if(mode === "spread"){
    const sp = spreadNo(cursor) + d;
    if(sp <= 0) cursor = 0;
    else cursor = Math.min(seq.length - 1, sp*2);
  }else{
    cursor = Math.max(0, Math.min(seq.length - 1, cursor + d));
  }
  render();
}
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);

document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  const k = e.key;
  if(k === "ArrowRight" || k === "ArrowLeft"){
    const d = k === "ArrowRight" ? 1 : -1;
    /* shift + arrow carries the current page with you */
    if(e.shiftKey && seq.length){ moveEntry(cursor, d > 0 ? cursor + 2 : cursor - 1); }
    else step(d);
    e.preventDefault();
  }
  else if(k === "1") setMode("single");
  else if(k === "2") setMode("spread");
  else if(k === "3") setMode("wall");
  else if(k.toLowerCase() === "b") insertBlank(cursor + 1);
  else if(k >= "5" && k <= "8"){ const c = CHAPTERS[+k - 5]; if(c) setChapter(c.id); }
});

const panel = document.getElementById("sheetpanel");
document.getElementById("btn-sheet").onclick = () => panel.classList.toggle("on");
document.getElementById("sheet-close").onclick = () => panel.classList.remove("on");

let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });

/* A previous sync survives a reload. On file:// some browsers refuse
   IndexedDB outright — in that case this simply finds nothing and the
   empty state asks for the folder again. */
(async () => {
  const saved = await idbGet("book");
  if(saved && saved.chapters){
    IDS.forEach(id => { BOOK[id] = (saved.chapters[id] || []).map(p => ({ ...p, url:null })); });
    LOOSE = saved.loose || LOOSE;
    BLANK = saved.blank ? { ...saved.blank, url:null } : null;
    source = saved.source || null;
    mintUrls();
  }
  loadAll();
  if(!SEQ[chapter].length){ const f = IDS.find(id => SEQ[id].length); if(f) chapter = f; seq = SEQ[chapter]; }
  setMode("spread");
})();
</script>
